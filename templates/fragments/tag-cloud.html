<div class="mx-auto max-w-3xl px-4 py-8 text-base-content">

  <div class="flex flex-wrap gap-1.5">
    {# Retrieve taxonomy data tailored to the current lang #}
    {% set taxonomy_data = get_taxonomy(kind="tags", lang=current_lang) %}
    {% if taxonomy_data and taxonomy_data.items %}
    {% for term in taxonomy_data.items %}
    <a href="{{ term.permalink | safe }}"
      class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-base-200 hover:bg-primary hover:text-primary-content transition-colors text-sm">
      <span>#{{ term.name }}</span>
      <!-- number badge -->
      <span class="text-xs px-1.5 py-0 rounded-md bg-base-300/80 font-mono opacity-80">
        {{ term.pages | length }}
      </span>
    </a>
    {% endfor %}
    {% endif %}
  </div>

</div>
