{% extends "base.html" %}

{% block content %}

<div class="mx-auto max-w-3xl px-4 py-8 text-base-content">
  <!-- breadcrumbs -->
  <nav class="text-xs breadcrumbs text-base-content/60 mb-4">
    <ul>
      <li><a href="/" class="hover:text-primary transition-colors">{{ root_section.extra.menu_home }}</a></li>
      <li class="text-base-content/80 font-medium truncate max-w-[180px] md:max-w-xs">Tag List</li>
    </ul>
  </nav>

  <!-- ページタイトル -->
  <header class="mb-10 border-b border-base-300 pb-5">
    <h1 class="text-3xl font-black tracking-tight">Tags</h1>
  </header>

  <!-- タグ一覧（控えめな件数カウンター付き） -->
  <div class="flex flex-wrap gap-2.5">
    {% for term in terms %}
    <a href="{{ term.permalink | safe }}"
      class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-base-200 hover:bg-primary hover:text-primary-content transition-colors text-sm font-medium">
      <span>#{{ term.name }}</span>
      <!-- 件数バッジ部分 -->
      <span class="text-xs px-1.5 py-0.5 rounded-md bg-base-300/80 font-mono opacity-80">
        {{ term.pages | length }}
      </span>
    </a>
    {% endfor %}
  </div>

</div>
{% endblock content %}
