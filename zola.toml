# The URL the site will be built for
# base_url = "https://mosaos.github.io/mosaos/my-portfolio"
base_url = "http://localhost"

description = "mosaos portfolio and blog"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

default_language = "en"

generate_feeds = true
feed_filenames = ["atom.xml"]

minify_html = true

# The default author for pages
author = "mosaos"

[languages.en]
title = "mosaos"
#generate_feeds = true
#feed_filenames = ["atom.xml"]
taxonomies = [
    { name = "tags" },
]

[languages.ja]
title = "mosaos"
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [
    { name = "tags" },
]

#------------------------------------------------------------------
# i18n
#------------------------------------------------------------------
[translations]
#-- ui --
view_all = "View all"
toc = "Table of Contents"
share_this = "Share this article"
#-- accessibility --
theme_selector = "Select theme"
font_size_selector = "Change font size"
lang_selector = "Select language"
menu_open = "Open menu"

[languages.ja.translations]
#-- ui --
view_all = "一覧へ"
toc = "目次"
share_this = "この記事をシェアする"
#-- accessibility --
theme_selector = "テーマの選択"
font_size_selector = "フォントサイズの変更"
lang_selector = "言語の選択"
menu_open = "メニューを開く"

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola

# if newer zola uncomment the follwings.
[markdown.highlighting]
theme = "github-dark"

#------------------------------------------------------------------
# The following are zola-daisyui-blog's specific settings
#------------------------------------------------------------------
[extra]
# Enable search form independently of build_search_index.
# Zola's standard build does not support Japanese search indexing.
# The search form is only available for English (lang=en).
search_enabled = true
# Put all your custom variables here
daisyui_theme = "night"
default_ogp_image = "/img/ogp-default.webp"
# google_analytics = "G-XXXXXXXXXX"
latest_max = 5

# SNS share
sns_x = true
sns_facebook = true
sns_threads = true
sns_hatebu = false   # Famous bookmark service in Japan
sns_line = false     # Famous instant messaging in Japan
